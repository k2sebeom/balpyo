<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  테스트 이미지의 폰트 렌더 설정. 목적은 예쁨이 아니라 결정성이다.

  - 힌팅을 끈다: 힌팅은 글리프를 픽셀 그리드에 맞추며 전진폭(advance width)을 바꾼다.
    브라우저와 LibreOffice가 서로 다르게 힌팅하면 같은 문장이 다른 줄에서 꺾인다.
  - 서브픽셀(LCD) 렌더를 끈다: 픽셀 비교에서 색 프린징이 노이즈가 된다.
  - 기본 sans/serif/monospace를 Noto로 고정한다.
-->
<fontconfig>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK KR</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
