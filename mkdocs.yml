site_name: balpyo
site_description: SOML로 슬라이드를 쓰면 balpyo가 웹 프레젠테이션과 편집 가능한 네이티브 PPTX로 렌더링한다.
site_author: k2sebeom
repo_url: https://github.com/k2sebeom/balpyo
repo_name: k2sebeom/balpyo

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - go
    - html
    - json
    - yaml
    - bash

# nav는 문서 구조를 그대로 따른다. iteration마다 페이지가 늘어나며,
# `mkdocs build --strict`가 nav에 없는 문서를 에러로 잡는다.
nav:
  - 개요: index.md
  - 레퍼런스:
      - reference/index.md
      - SOML — slide: reference/soml/slide.md
      - SOML — text: reference/soml/text.md
      - SOML — 텍스트 서브셋: reference/soml/text-subset.md
      - SOML — 레이아웃: reference/soml/layout.md
      - SOML — stack: reference/soml/stack.md
      - SOML — shape: reference/soml/shape.md
      - SOML — image: reference/soml/image.md
      - SOML — table: reference/soml/table.md
      - SOML — chart: reference/soml/chart.md
      - SOML — note: reference/soml/note.md
      - 외관 속성: reference/appearance.md
      - 레이아웃 카탈로그: reference/layouts.md
      - 테마 패키지: reference/theme.md
      - CLI: reference/cli.md
  - 가이드:
      - guides/index.md
      - 시작하기: guides/getting-started.md
      - 배치 경고 읽기: guides/layout-warnings.md
      - 테마 고르기·만들기: guides/theming.md
      - 알려진 차이: guides/known-differences.md
  - 내부 구조:
      - 아키텍처: internals/architecture.md
      - 지오메트리 패스: internals/geometry-pass.md
      - 테스트 환경: internals/testing.md
      - 릴리스: internals/release.md
  - 설계 결정:
      - decisions/index.md
      - 0001 파서 트리비아: decisions/0001-parser-trivia.md
      - 0002 논리 스테이지 크기: decisions/0002-logical-stage-size.md
      - 0003 인라인 style 외관: decisions/0003-inline-style-appearance.md
      - 0004 지오메트리 곁 표: decisions/0004-geometry-side-table.md
      - 0005 줄간격과 안전 여유: decisions/0005-line-spacing-and-slack.md
      - 0006 발표자 뷰 속성 전환: decisions/0006-presenter-view-attribute.md
      - 0007 블록 태그 역할의 소유 경계: decisions/0007-block-tag-role-ownership.md
      - 0008 런 스타일 상속-복사: decisions/0008-run-style-inherit-copy.md
      - 0009 측정 대상은 블록 종류뿐: decisions/0009-measured-kinds.md
      - 0010 링크 색 accent1 재사용: decisions/0010-link-color-accent1.md
      - 0011 레이아웃 컨테이너는 도형이 아니다: decisions/0011-layout-containers-are-not-shapes.md
      - 0012 공간 토큰에는 테마 슬롯이 없다: decisions/0012-space-tokens-have-no-theme-slot.md
      - 0013 측정 대상에 레이아웃을 넣는다: decisions/0013-measured-kinds-include-layout.md
      - 0014 style 탈출구의 경계: decisions/0014-style-escape-hatch-boundary.md
      - 0015 fill은 해당 축의 100%: decisions/0015-fill-is-hundred-percent.md
      - 0016 도형 안 텍스트는 도형의 본문: decisions/0016-shape-text-is-shape-body.md
      - 0017 도형 기하는 OOXML 프리셋에서 유도한다: decisions/0017-shape-geometry-from-ooxml-presets.md
      - 0018 opacity는 색 알파로 컴파일된다: decisions/0018-opacity-compiles-to-color-alpha.md
      - 0019 radius는 rounded-rect 전용: decisions/0019-radius-is-rounded-rect-only.md
      - 0020 shadow는 토큰만 받는다: decisions/0020-shadow-tokens-only.md
      - 0021 측정 뷰에서 변형을 끈다: decisions/0021-measure-view-disables-transforms.md
      - 0022 도형 variant는 상속하지 않는다: decisions/0022-shape-variants-do-not-inherit.md
      - 0023 에셋 표는 덱이 소유한다: decisions/0023-assets-live-in-the-deck.md
      - 0024 src는 프로젝트 루트 기준이다: decisions/0024-src-is-project-relative.md
      - 0025 이미지 포맷은 PNG·JPEG 2종: decisions/0025-image-formats-are-png-and-jpeg.md
      - 0026 contain은 박스를 그림에 맞춘다: decisions/0026-contain-fits-the-box-to-the-picture.md
      - 0027 alt을 열고 frame을 닫는다: decisions/0027-open-alt-close-frame.md
      - 0028 stack은 새 종류가 아니라 새 흐름이다: decisions/0028-stack-is-a-flow-not-a-kind.md
      - 0029 겹침 칠 순서는 PPTX를 따른다: decisions/0029-paint-order-follows-pptx.md
      - 0030 캔버스 좌표는 스테이지 패딩 박스 기준: decisions/0030-canvas-origin-is-stage-padding-box.md
      - 0031 한 축의 위치는 한 채널이 정한다: decisions/0031-position-is-one-channel.md
      - 0032 슬라이드 어휘는 값과 Span으로 core가 검사한다: decisions/0032-slide-layout-vocab-is-core-checked.md
      - 0033 색 변형은 참조를 보존한다: decisions/0033-color-variants-preserve-scheme-ref.md
      - 0034 그라디언트는 SVG def로 내고 objectBoundingBox로 늘린다: decisions/0034-gradient-svg-def-and-objectboundingbox.md
      - 0035 슬롯은 진짜 플레이스홀더가 되고 명시 재정의로 패리티를 지킨다: decisions/0035-slots-are-real-placeholders-with-explicit-override.md
      - 0036 table은 HTML식 tr/td이고 명시 좌표로 a:tbl이 된다: decisions/0036-table-is-html-ish-tr-td-with-explicit-a-tbl.md
      - 0037 문자 참조는 세미콜론을 요구하고 CDATA를 연다: decisions/0037-char-refs-require-semicolon-and-cdata.md
      - 0038 목록의 외관은 컨테이너에 쓰고 항목이 상속한다: decisions/0038-list-appearance-lives-on-the-container.md
      - 0039 배치 경고는 박스 포함 관계로 판정한다: decisions/0039-layout-warnings-are-box-containment.md
      - 0040 프리셋의 텍스트 영역은 기하 표의 한 열이다: decisions/0040-preset-text-rect-is-a-geometry-column.md
      - 0041 chevron의 텍스트 영역은 PPTX가 되돌린다: decisions/0041-chevron-text-rect-is-cancelled-in-pptx.md
      - 0042 chevron의 라벨은 도형 밖에 둔다: decisions/0042-chevron-labels-stay-outside-the-shape.md
      - 0043 확정 폭은 배치 문맥의 것이다: decisions/0043-explicit-width-belongs-to-the-placement-context.md
      - 0044 슬롯은 테마가 받아야 뜻이 있다: decisions/0044-slots-need-a-theme-and-vertical-rhythm-needs-an-owner.md
      - 0045 덱 크롬은 설정·테마·a:fld가 나눠 소유한다: decisions/0045-deck-chrome-is-config-text-in-a-theme-declared-band.md
      - 0046 watch는 폴링하고 리로드 클라이언트를 주입한다: decisions/0046-watch-polls-the-project-and-injects-its-reload-client.md
      - 0047 검수 갤러리는 internal/preview가 소유한다: decisions/0047-review-gallery-lives-in-internal-preview.md
      - 0048 init은 자기 덱을 소유하고 check는 쓰지 않는 build다: decisions/0048-init-owns-its-deck-and-check-is-build-without-writing.md
      - 0049 배치를 담은 도형은 배경이 된다: decisions/0049-a-shape-that-holds-layout-becomes-a-backdrop.md
      - 0050 강조색 여섯은 재서 고른 팔레트다: decisions/0050-six-accents-are-a-measured-palette-not-a-ranking.md
      - 0051 하이라이팅은 토큰 스트림이다: decisions/0051-highlighting-is-a-token-stream-compiled-to-runs.md
      - 0052 테마 선택은 덱의 요청이다: decisions/0052-theme-selection-is-a-deck-request-and-there-is-no-fallback-theme.md
      - 0053 가운데 정렬만 가로를 가져간다: decisions/0053-a-theme-takes-the-horizontal-channel-only-to-center.md
      - 0054 외부 테마는 이름이고 extends는 이름 단위다: decisions/0054-an-external-theme-is-a-name-inside-the-project-and-extends-overrides-by-name.md
      - 0055 자식 테마는 색을 갈아 끼운다: decisions/0055-a-child-theme-recolors-by-name-because-color-tokens-are-bounded-by-the-clrscheme.md
      - 0056 예제는 경고 0의 빌드로 게이트한다: decisions/0056-examples-are-gated-by-a-strict-build-not-by-goldens.md
      - 0057 문서의 닫힌 목록은 테스트가 읽는다: decisions/0057-docs-are-hand-written-but-closed-lists-are-read-from-them-by-a-test.md
      - 0058 alt은 그림에 이름을 더하고 읽기 순서는 문서 순서다: decisions/0058-alt-names-the-drawing-and-reading-order-is-document-order.md
      - 0059 chart는 값 층이 도형·텍스트로 펼친다: decisions/0059-chart-is-desugared-into-shapes-and-text-not-a-native-chart-part.md
      - 0060 계열색은 프레임이 소유한다: decisions/0060-the-series-color-belongs-to-the-frame-and-a-point-fill-is-emphasis.md
      - 0061 릴리스는 make와 Go 툴체인이 만든다: decisions/0061-release-is-built-by-make-and-the-go-toolchain-and-the-version-belongs-to-the-tag.md
      - 0062 뷰어는 embed된 자산이고 오버뷰·인쇄는 뷰의 상태다: decisions/0062-the-viewer-is-embedded-assets-and-overview-and-print-are-view-states.md
      - 0063 reveal은 발표자 뷰에서만 숨긴다: decisions/0063-reveal-is-presenter-only-hiding-and-every-other-target-is-flattened.md
      - 0064 계약은 컴포넌트·레이아웃 동일성이다: decisions/0064-the-contract-is-component-and-layout-parity-not-pixel-parity.md

# 빌드 의존성 파일은 사이트에 복사하지 않는다.
exclude_docs: |
  requirements.txt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      # 이 문서는 한국어라 기본 슬러그(비ASCII를 버린다)로는 제목 대부분의 앵커가 `_1`,
      # `_2`가 된다 — 독자가 복사하는 퍼머링크가 뜻을 갖지 않고 제목을 하나 끼워 넣으면
      # 번호가 밀린다. 유니코드 슬러그는 제목 글자를 그대로 앵커로 쓴다.
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  # 하이라이팅은 readthedocs 테마의 highlight.js 가 담당한다.
  # codehilite(Pygments)를 켜면 테마에 토큰 CSS가 없어 색이 죽고, 두 번 하이라이팅된다.
  - fenced_code

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # 앵커가 틀린 링크도 게이트다 — 페이지는 열리면서 절만 못 찾는 링크는 사람이 눌러 보지
  # 않으면 드러나지 않는다 (--strict가 경고를 에러로 올린다).
  links:
    anchors: warn
