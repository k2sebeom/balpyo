site_name: balpyo
site_description: SOML로 슬라이드를 쓰면 balpyo가 웹 프레젠테이션과 편집 가능한 네이티브 PPTX로 렌더링한다.
site_author: k2sebeom
site_url: https://k2sebeom.github.io/balpyo/
repo_url: https://github.com/k2sebeom/balpyo
repo_name: k2sebeom/balpyo

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - go
    - html
    - json
    - yaml
    - bash

# nav는 문서 구조를 그대로 따른다. iteration마다 페이지가 늘어나며,
# `mkdocs build --strict`가 nav에 없는 문서를 에러로 잡는다.
nav:
  - 개요: index.md
  - 레퍼런스:
      - reference/index.md
      - SOML — slide: reference/soml/slide.md
      - SOML — text: reference/soml/text.md
      - SOML — 텍스트 서브셋: reference/soml/text-subset.md
      - SOML — 레이아웃: reference/soml/layout.md
      - SOML — stack: reference/soml/stack.md
      - SOML — shape: reference/soml/shape.md
      - SOML — image: reference/soml/image.md
      - SOML — table: reference/soml/table.md
      - SOML — chart: reference/soml/chart.md
      - SOML — connector: reference/soml/connector.md
      - SOML — enter · transition: reference/soml/enter.md
      - SOML — note: reference/soml/note.md
      - 외관 속성: reference/appearance.md
      - 레이아웃 카탈로그: reference/layouts.md
      - 테마 패키지: reference/theme.md
      - CLI: reference/cli.md
  - 가이드:
      - guides/index.md
      - 시작하기: guides/getting-started.md
      - 배치 경고 읽기: guides/layout-warnings.md
      - 테마 고르기·만들기: guides/theming.md
      - 계약 밖의 차이: guides/known-differences.md

# 빌드 의존성 파일은 사이트에 복사하지 않는다.
exclude_docs: |
  requirements.txt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      # 이 문서는 한국어라 기본 슬러그(비ASCII를 버린다)로는 제목 대부분의 앵커가 `_1`,
      # `_2`가 된다 — 독자가 복사하는 퍼머링크가 뜻을 갖지 않고 제목을 하나 끼워 넣으면
      # 번호가 밀린다. 유니코드 슬러그는 제목 글자를 그대로 앵커로 쓴다.
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  # 하이라이팅은 readthedocs 테마의 highlight.js 가 담당한다.
  # codehilite(Pygments)를 켜면 테마에 토큰 CSS가 없어 색이 죽고, 두 번 하이라이팅된다.
  - fenced_code

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # 앵커가 틀린 링크도 게이트다 — 페이지는 열리면서 절만 못 찾는 링크는 사람이 눌러 보지
  # 않으면 드러나지 않는다 (--strict가 경고를 에러로 올린다).
  links:
    anchors: warn
