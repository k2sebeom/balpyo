site_name: balpyo
site_description: SOML로 슬라이드를 쓰면 balpyo가 웹 프레젠테이션과 편집 가능한 네이티브 PPTX로 렌더링한다.
site_author: k2sebeom
repo_url: https://github.com/k2sebeom/balpyo
repo_name: k2sebeom/balpyo

docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - go
    - html
    - json
    - yaml
    - bash

# nav는 문서 구조를 그대로 따른다. iteration마다 페이지가 늘어나며,
# `mkdocs build --strict`가 nav에 없는 문서를 에러로 잡는다.
nav:
  - 개요: index.md
  - 레퍼런스:
      - reference/index.md
      - SOML — slide: reference/soml/slide.md
      - SOML — text: reference/soml/text.md
      - SOML — note: reference/soml/note.md
      - 외관 속성: reference/appearance.md
      - CLI: reference/cli.md
  - 가이드:
      - guides/index.md
  - 내부 구조:
      - 아키텍처: internals/architecture.md
      - 지오메트리 패스: internals/geometry-pass.md
      - 테스트 환경: internals/testing.md
  - 설계 결정:
      - decisions/index.md
      - 0001 파서 트리비아: decisions/0001-parser-trivia.md
      - 0002 논리 스테이지 크기: decisions/0002-logical-stage-size.md
      - 0003 인라인 style 외관: decisions/0003-inline-style-appearance.md
      - 0004 지오메트리 곁 표: decisions/0004-geometry-side-table.md
      - 0005 줄간격과 안전 여유: decisions/0005-line-spacing-and-slack.md
      - 0006 발표자 뷰 속성 전환: decisions/0006-presenter-view-attribute.md

# 빌드 의존성 파일은 사이트에 복사하지 않는다.
exclude_docs: |
  requirements.txt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  # 하이라이팅은 readthedocs 테마의 highlight.js 가 담당한다.
  # codehilite(Pygments)를 켜면 테마에 토큰 CSS가 없어 색이 죽고, 두 번 하이라이팅된다.
  - fenced_code

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
