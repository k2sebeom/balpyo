# 릴리스는 **태그가 트리거한다**.
#
# 발표한 아티팩트는 되돌릴 수 없으므로 게이트를 다시 돈다: 태그가 main의 초록 커밋을 가리킨다고
# 믿지 않고 `make test`를 여기서 또 돌린다. 게이트와 아카이브는 같은 잡 · 같은 툴체인(go.mod의 Go)에서
# 나온다 — "두 번 빌드하면 같은 바이트"는 툴체인이 지키는 계약이다.
#
# tap 저장소(homebrew-balpyo)에 포뮬러를 올리는 것은 **사람의 일**이다: 우리 저장소가 아닌 곳에
# 쓰는 토큰을 CI에 두지 않는다. 그래서 `balpyo.rb`는 릴리스에 첨부만 한다.
name: Release

on:
  push:
    tags: ['v*']

# 태그는 되돌릴 수 없으므로 진행 중인 실행을 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 아카이브
    runs-on: ubuntu-latest
    env:
      BALPYO_TEST_STRICT: '1'
      BALPYO_CHROMIUM_NO_SANDBOX: '1'
    steps:
      # vcs 스탬핑이 커밋·시각을 읽으므로 얕은 체크아웃으로도 되지만, 태그를 읽어야 하므로
      # fetch-depth: 0으로 받는다 (`git describe --exact-match`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 게이트 (릴리스도 같은 테스트를 지난다)
        run: make test

      # 버전은 태그가 소유한다 — 워크플로가 이름을 만들지 않고 참조에서 그대로 읽는다.
      - name: 릴리스 빌드
        run: make dist VERSION=${{ github.ref_name }}

      - name: 산출물 확인
        run: |
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)

      # 릴리스 노트는 사람이 쓴다 (커밋 메시지는 릴리스 노트가 아니다). 그래서
      # draft로 만들고, 발표는 사람이 누른다.
      - name: GitHub Release 초안
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/balpyo_*.tar.gz
            dist/SHA256SUMS
            dist/balpyo.rb
