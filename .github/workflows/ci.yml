# CI는 로컬과 **같은 명령**을 돈다: `go test ./...`.
#
# 계약은 컴포넌트 · 레이아웃 동일성이고 PPTX의 유효성은 ECMA-376 스키마가 판정하므로,
# 렌더 환경을 고정할 컨테이너가 없다. 빌드(지오메트리 패스)는 러너에 깔린 Chrome을 쓴다.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    env:
      # 브라우저가 없어서 건너뛴 테스트를 초록으로 읽지 않는다 — 러너에서는 실패다.
      BALPYO_TEST_STRICT: '1'
      # Ubuntu 러너의 AppArmor가 비특권 사용자 이름공간을 막아 Chrome 샌드박스가 뜨지 않는다.
      BALPYO_CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 내장 · 예제 테마의 글꼴이다. 측정 브라우저에 없으면 잰 빌드가 글꼴 경고를 내고, 예제
      # 게이트는 경고 0이어야 하므로 러너의 설치 목록에 따라 결과가 갈리면 안 된다.
      - name: theme fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-mono fonts-noto-cjk

      - name: test
        run: make test

  docs:
    name: 문서 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # --strict: 끊긴 링크와 nav에 없는 문서를 에러로 잡는다. 문서 갱신은 변경의
      # 완료 조건이므로 CI가 검사한다.
      - name: docs build
        run: make docs
