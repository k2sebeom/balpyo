<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text deck</title>
<meta name="author" content="balpyo">
<style>
@layer balpyo.base, balpyo.theme, balpyo.author;

@layer balpyo.base {
  :root {
    --balpyo-stage-width: 1280px;
    --balpyo-stage-height: 720px;
  }

  * { box-sizing: border-box; }

  /* 뷰어 크롬의 바탕 — 슬라이드 밖의 색이므로 덱의 색이 아니다 (테마 토큰이 아닌 유일한 색). */
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
  }

  .balpyo-deck {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 24px;
  }

  /* 슬라이드는 논리 스테이지 크기를 그대로 갖는다. 저자·웹·지오메트리 패스가 같은
     좌표계를 쓰므로 지오메트리 패스가 읽은 rect가 곧 PPTX 좌표다 (환산 분기 없음). */
  .balpyo-slide {
    position: relative;
    width: var(--balpyo-stage-width);
    height: var(--balpyo-stage-height);
    overflow: hidden;
  }

  /* 스테이지는 자식을 문서 순서대로 세로로 쌓는다. 여백 64px은 1280폭의 5%로,
     프로젝터의 오버스캔에서도 글자가 잘리지 않는다.

     text-autospace는 잰 폭을 고정한다 — 브라우저가 한글↔라틴 경계에 간격을 넣기
     시작하면(CSS Text 4는 그것을 기본값에 둔다) 잰 폭이 움직이고, 잰 폭이 곧 PPTX
     좌표이므로 저자가 아무것도 고치지 않은 채 줄이 다시 접힌다 (D11, ADR 0005). */
  .balpyo-stage {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    text-autospace: no-autospace;
  }

  /* 텍스트 블록은 콘텐츠 폭 전체를 갖는다 — 줄바꿈 폭이 확정되어야 브라우저가 잰 박스가
     PPTX 텍스트 박스로 그대로 간다. flex: 0 0 auto는 스택이 스테이지보다 길 때 박스가
     눌리는 것을 막는다 (기본 정책은 박스 고정 + 오버플로 허용 — PRD §13-1). */
  .balpyo-text {
    margin: 0;
    width: 100%;
    flex: 0 0 auto;
  }

  /* 이 파일은 뷰어 CSS다 (render/web.viewerCSS가 go:embed로 싣는다). index.html의 <style>
     안, `@layer balpyo.base` 블록 **안에** 그대로 들어가므로 규칙이 2칸 들여쓰기로 시작한다.
     닫는 style 태그를 담으면(주석 안이어도) 문서가 그 자리에서 끝난다 — runtime_test가 막는다. */

  /* ── 발표자 뷰 ── 런타임 JS가 <html>에 data-balpyo-view="presenter"를 켠다.
     속성이 없으면(JS 꺼짐, 또는 지오메트리 패스가 지운 상태) 위의 세로 스택 그대로다. */
  .balpyo-viewer-bar, .balpyo-viewer-notes { display: none; }

  html[data-balpyo-view="presenter"] { height: 100%; }
  html[data-balpyo-view="presenter"] body { height: 100%; overflow: hidden; }
  html[data-balpyo-view="presenter"] .balpyo-deck {
    position: fixed;
    inset: 0;
    padding: 0;
    display: block;
  }

  /* 슬라이드는 전부 화면 가운데 겹쳐 두고 활성 슬라이드만 보인다. display가 아니라
     visibility인 이유와 transform 스케일인 이유는 파일 머리 주석에 있다. */
  html[data-balpyo-view="presenter"] .balpyo-slide {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--balpyo-view-scale, 1));
    visibility: hidden;
  }
  html[data-balpyo-view="presenter"] .balpyo-slide.balpyo-viewer-active {
    visibility: visible;
  }

  /* 컨트롤 바는 오버뷰에서도 보인다 — 키보드를 모르는 사람이 오버뷰에서 나갈 길이 그것이다.
     값을 묻지 않는 선택자(html[data-balpyo-view])를 쓰지 않는 이유는 측정 뷰다: 재는 동안
     크롬이 그려지면 그 뒤에 찍는 스크린샷이 산출물이 아닌 측정 상태를 본다. */
  html[data-balpyo-view="presenter"] .balpyo-viewer-bar,
  html[data-balpyo-view="overview"] .balpyo-viewer-bar {
    display: flex;
    align-items: center;
    gap: 2px;
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 10;
    padding: 4px;
    border-radius: 999px;
    background: rgba(20, 20, 22, 0.88);
    color: #ddd;
    font: 14px/1 system-ui, sans-serif;
  }
  .balpyo-viewer-bar button {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .balpyo-viewer-bar button:hover { background: rgba(255, 255, 255, 0.12); }
  .balpyo-viewer-bar button:disabled { opacity: 0.35; cursor: default; background: transparent; }
  .balpyo-viewer-bar button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.18); }
  .balpyo-viewer-counter {
    padding: 0 10px;
    color: #aaa;
    font-variant-numeric: tabular-nums;
  }

  html[data-balpyo-view="presenter"] .balpyo-viewer-notes {
    display: block;
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    z-index: 10;
    width: min(640px, calc(100vw - 48px));
    max-height: 40vh;
    overflow-y: auto;
    padding: 14px 18px;
    border-radius: 12px;
    background: rgba(20, 20, 22, 0.92);
    color: #e6e6e6;
    font: 15px/1.6 system-ui, sans-serif;
    white-space: pre-wrap;
  }
  /* hidden 속성이 이겨야 한다 — 위의 display: block이 UA 스타일을 덮으므로 명시한다. */
  html[data-balpyo-view="presenter"] .balpyo-viewer-notes[hidden] { display: none; }
  .balpyo-viewer-notes.balpyo-viewer-empty { color: #999; font-style: italic; }

  /* ── 오버뷰 ── 슬라이드 전부를 격자로 줄여 놓고 하나를 골라 들어간다 (ADR 0062).
     줄이는 수단은 zoom이다: transform은 부모가 보는 칸 크기를 줄이지 않아 타일마다 감싸는
     요소가 필요하고, 그 요소는 지오메트리 패스가 읽는 부모 사슬을 바꾼다. zoom 아래에서도
     레이아웃 크기(offsetWidth)는 논리 스테이지 그대로이므로 화면 맞춤 배율 계산에 되먹임이
     없다. 열 수와 배율은 런타임이 창에 맞춰 계산해 넣는다 — CSS는 슬라이드 수를 모른다. */
  html[data-balpyo-view="overview"] { height: 100%; }
  html[data-balpyo-view="overview"] body { height: 100%; overflow: hidden; }
  html[data-balpyo-view="overview"] .balpyo-deck {
    display: grid;
    grid-template-columns: repeat(var(--balpyo-overview-columns, 4), max-content);
    justify-content: center;
    align-content: center;
    height: 100%;
    gap: 16px;
    /* 아래쪽은 컨트롤 바 높이만큼 더 비운다 — 런타임의 열 계산이 같은 값을 쓴다. */
    padding: 16px 16px 64px;
  }
  html[data-balpyo-view="overview"] .balpyo-slide {
    zoom: var(--balpyo-overview-zoom, 0.2);
    cursor: pointer;
    outline: 4px solid transparent;
  }
  /* 활성 슬라이드는 **나갈 자리**다 (오버뷰는 이동이 아니라 보기다) — 테두리로 표시한다.
     테두리도 zoom을 받으므로 4px은 화면에서 1px 남짓이다. */
  html[data-balpyo-view="overview"] .balpyo-slide.balpyo-viewer-active {
    outline-color: #fff;
  }

  /* ── 인쇄 ── 어느 뷰에서 눌러도 문서 뷰의 그림이 나온다 (ADR 0062).
     인쇄는 뷰가 아니라 **미디어**다: 사람은 뷰를 바꾸고 인쇄하지 않고 보고 있는 화면에서
     누른다 (그래서 인쇄 CSS가 없으면 발표자 뷰에서 누른 사람은 활성 슬라이드 한 장만 담긴
     letter PDF를 받는다 — 실측). 그러므로 켜진 뷰를 되돌려야 하고, 이 절은 뷰 규칙 **뒤**에
     온다: 게이트와 같은 명시도의 선택자(값을 묻지 않는 html[data-balpyo-view])를 뒤에 두면
     !important 없이 이긴다. 종이 크기(@page)는 스테이지가 덱마다 달라 baseCSS가 만든다. */
  @media print {
    html, html[data-balpyo-view] { height: auto; background: #fff; }
    body, html[data-balpyo-view] body { height: auto; overflow: visible; background: #fff; }
    .balpyo-deck, html[data-balpyo-view] .balpyo-deck {
      position: static;
      display: block;
      height: auto;
      gap: 0;
      padding: 0;
    }
    /* 한 장이 한 페이지다 — 겹쳐 둔 슬라이드를 세로 스택으로 돌리고 페이지를 나눈다. */
    .balpyo-slide, html[data-balpyo-view] .balpyo-slide {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      visibility: visible;
      zoom: 1;
      outline: none;
      break-inside: avoid;
      break-after: page;
    }
    /* 마지막 장 뒤에 빈 페이지를 하나 더 만들지 않는다. */
    .balpyo-slide:last-child, html[data-balpyo-view] .balpyo-slide:last-child { break-after: auto; }
    /* 오버뷰의 활성 테두리는 종이에 남지 않는다 (테두리 규칙이 한 단계 더 구체적이다). */
    .balpyo-slide.balpyo-viewer-active,
    html[data-balpyo-view] .balpyo-slide.balpyo-viewer-active { outline-color: transparent; }
    .balpyo-viewer-bar, html[data-balpyo-view] .balpyo-viewer-bar,
    .balpyo-viewer-notes, html[data-balpyo-view] .balpyo-viewer-notes { display: none; }
  }

  @media print {
    @page { size: 1280px 720px; margin: 0; }
  }
}

@layer balpyo.theme {
  /* 테마 "minimal"의 토큰 표 — 웹 변수와 PPTX 테마 파트가 이 한 표에서 나온다. */
  :root {
    --balpyo-color-fg: #1A1A1A;
    --balpyo-color-bg: #FFFFFF;
    --balpyo-color-muted: #6B7280;
    --balpyo-color-surface: #F3F4F6;
    --balpyo-color-accent1: #0F65F9;
    --balpyo-color-accent2: #0E8174;
    --balpyo-color-accent3: #15803D;
    --balpyo-color-accent4: #B45309;
    --balpyo-color-accent5: #DC2626;
    --balpyo-color-accent6: #9333EA;
    --balpyo-font-heading: "Noto Sans", "Noto Sans CJK KR", sans-serif;
    --balpyo-font-body: "Noto Sans", "Noto Sans CJK KR", sans-serif;
    --balpyo-font-mono: "Noto Sans Mono", "Noto Sans Mono CJK KR", monospace;
  }

  .balpyo-slide { background: var(--balpyo-color-bg); }
}
</style>
</head>
<body>
<div class="balpyo-deck" data-aspect="16:9" data-slides="3">
<section class="balpyo-slide" id="title" data-slide-index="0" data-slide-source="slides/001_title.slide">
<div class="balpyo-stage">
<div class="balpyo-text" data-balpyo-id="s0.0" data-balpyo-el="text" style="font-family: var(--balpyo-font-body); font-size: 20px; font-weight: 400; line-height: 1.4; color: var(--balpyo-color-muted); text-align: center">Platform Team</div>
<div class="balpyo-text" data-balpyo-id="s0.1" data-balpyo-el="text" style="font-family: var(--balpyo-font-heading); font-size: 64px; font-weight: 700; line-height: 1.2; color: var(--balpyo-color-fg); text-align: center">2026 아키텍처 리뷰</div>
<div class="balpyo-text" data-balpyo-id="s0.2" data-balpyo-el="text" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: center">상반기 회고와 하반기 계획</div>
</div>
<div class="balpyo-notes" hidden>인사 30초. 청중에 인프라팀 포함되어 있음.</div>
</section>
<section class="balpyo-slide" id="overview" data-slide-index="1" data-slide-source="slides/002_overview.slide">
<div class="balpyo-stage">
<div class="balpyo-text" data-balpyo-id="s1.0" data-balpyo-el="text" style="font-family: var(--balpyo-font-heading); font-size: 36px; font-weight: 700; line-height: 1.3; color: var(--balpyo-color-accent1); text-align: start">올해의 세 가지 변화</div>
<div class="balpyo-text" data-balpyo-id="s1.1" data-balpyo-el="text" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start">모놀리스 분리를 마쳤고, 배포 파이프라인을 자동화했으며, 관측성 스택(OpenTelemetry + Grafana)을 도입했다.</div>
<div class="balpyo-text" data-balpyo-id="s1.2" data-balpyo-el="text" style="font-family: var(--balpyo-font-body); font-size: 18px; font-weight: 400; line-height: 1.4; color: var(--balpyo-color-muted); text-align: end">2026 H1</div>
</div>
</section>
<section class="balpyo-slide" id="closing" data-slide-index="2" data-slide-source="slides/003_closing.slide">
<div class="balpyo-stage">
<div class="balpyo-text" data-balpyo-id="s2.0" data-balpyo-el="text" style="font-family: var(--balpyo-font-heading); font-size: 56px; font-weight: 700; line-height: 1.2; color: var(--balpyo-color-fg); text-align: center">질의응답 (Q and A)</div>
</div>
<div class="balpyo-notes" hidden>질문이 없으면 하반기 로드맵 슬라이드로 되돌아간다.</div>
</section>
</div>
<script>
// 이 파일은 뷰어 런타임이다 (render/web.runtimeJS가 go:embed로 싣는다). index.html의 <body>
// 끝에 script 태그로 인라인되므로 여닫는 태그 문자열을 담을 수 없다 — 닫는 태그는 문서를 그
// 자리에서 끝내고, 여는 태그는 "런타임은 한 번만 실린다" 게이트를 속인다 (runtime_test가 막는다). 덱 데이터를 보간하지 않는 **고정 파일**이다: 슬라이드·노트는
// 전부 DOM에서 읽으므로 저자 텍스트가 스크립트로 새는 경로가 없다.
(() => {
  "use strict";
  const root = document.documentElement;
  const slides = Array.from(document.querySelectorAll(".balpyo-slide"));
  if (slides.length === 0) return;

  const button = (cls, label, text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.setAttribute("aria-label", label);
    b.textContent = text;
    return b;
  };
  const prev = button("balpyo-viewer-prev", "Previous slide", "‹");
  const next = button("balpyo-viewer-next", "Next slide", "›");
  const notesToggle = button("balpyo-viewer-notes-toggle", "Toggle speaker notes", "Notes");
  notesToggle.setAttribute("aria-pressed", "false");
  const overviewToggle = button("balpyo-viewer-overview", "Toggle slide overview", "Grid");
  overviewToggle.setAttribute("aria-pressed", "false");
  const counter = document.createElement("span");
  counter.className = "balpyo-viewer-counter";

  const bar = document.createElement("nav");
  bar.className = "balpyo-viewer-bar";
  bar.setAttribute("aria-label", "Presentation controls");
  bar.append(prev, counter, next, overviewToggle, notesToggle);

  const notes = document.createElement("aside");
  notes.className = "balpyo-viewer-notes";
  notes.setAttribute("aria-label", "Speaker notes");
  notes.hidden = true;

  document.body.append(notes, bar);

  let current = -1;

  // 배율은 창에 꽉 차는 fit이다. 레이아웃 크기(offsetWidth)는 transform과 무관하게 논리
  // 스테이지이므로, 잰 값을 다시 스케일하는 되먹임이 없다.
  const fit = () => {
    const scale = Math.min(
      window.innerWidth / slides[0].offsetWidth,
      window.innerHeight / slides[0].offsetHeight);
    root.style.setProperty("--balpyo-view-scale", String(scale));
  };

  const show = (index, writeHash) => {
    const target = Math.min(Math.max(index, 0), slides.length - 1);
    if (target === current) return;
    if (current >= 0) slides[current].classList.remove("balpyo-viewer-active");
    current = target;
    const slide = slides[current];
    slide.classList.add("balpyo-viewer-active");
    counter.textContent = (current + 1) + " / " + slides.length;
    prev.disabled = current === 0;
    next.disabled = current === slides.length - 1;
    const note = slide.querySelector(".balpyo-notes");
    notes.textContent = note ? note.textContent : "No notes for this slide.";
    notes.classList.toggle("balpyo-viewer-empty", !note);
    if (writeHash) {
      // 히스토리를 쌓지 않는다 — 뒤로 가기가 슬라이드를 되감으면 발표 중에 페이지를
      // 떠나는 길이 없어진다. file://에서 막는 브라우저가 있어도 조용히 넘어간다.
      try { history.replaceState(null, "", "#/" + encodeURIComponent(slide.id)); } catch (e) {}
    }
  };

  // ── 오버뷰 ──
  //
  // 오버뷰는 발표자 뷰 안의 상태가 아니라 **같은 속성의 다른 값**이다 (ADR 0062). 드나드는
  // 것으로 현재 슬라이드가 바뀌지 않는다 — 오버뷰는 이동이 아니라 보기이고, 나오면 보고 있던
  // 자리로 돌아온다. 자리를 옮기는 것은 타일 클릭(과 오버뷰에서도 듣는 화살표)뿐이다.
  const overviewOn = () => root.getAttribute("data-balpyo-view") === "overview";

  // 격자는 **전부 한 화면에** 들어와야 한다: 열 수를 1..n으로 훑어 타일이 가장 커지는 값을
  // 고르고 그 폭에서 zoom을 얻는다. 간격·여백은 viewer.css와 같은 값이고, 아래쪽은 컨트롤
  // 바가 타일을 덮지 않도록 바 높이만큼 더 비운다.
  const OVERVIEW_GAP = 16, OVERVIEW_PAD = 16, OVERVIEW_BAR = 48;
  const overviewFit = () => {
    const stageWidth = slides[0].offsetWidth, stageHeight = slides[0].offsetHeight;
    const roomWidth = window.innerWidth - 2 * OVERVIEW_PAD;
    const roomHeight = window.innerHeight - 2 * OVERVIEW_PAD - OVERVIEW_BAR;
    let best = {columns: 1, width: 0};
    for (let columns = 1; columns <= slides.length; columns++) {
      const rows = Math.ceil(slides.length / columns);
      const width = Math.min(
        (roomWidth - (columns - 1) * OVERVIEW_GAP) / columns,
        ((roomHeight - (rows - 1) * OVERVIEW_GAP) / rows) * (stageWidth / stageHeight));
      if (width > best.width) best = {columns, width};
    }
    root.style.setProperty("--balpyo-overview-columns", String(best.columns));
    root.style.setProperty("--balpyo-overview-zoom", String(Math.max(best.width, 1) / stageWidth));
  };

  const setOverview = (on) => {
    if (on) overviewFit();
    root.setAttribute("data-balpyo-view", on ? "overview" : "presenter");
    overviewToggle.setAttribute("aria-pressed", String(on));
  };

  const fromHash = () => {
    let raw = location.hash.replace(/^#\/?/, "");
    try { raw = decodeURIComponent(raw); } catch (e) {}
    if (raw === "") return 0;
    const byID = slides.findIndex((s) => s.id === raw);
    if (byID >= 0) return byID;
    const n = Number(raw);
    if (Number.isInteger(n) && n >= 1 && n <= slides.length) return n - 1;
    return 0;
  };

  prev.addEventListener("click", () => show(current - 1, true));
  next.addEventListener("click", () => show(current + 1, true));
  notesToggle.addEventListener("click", () => {
    notes.hidden = !notes.hidden;
    notesToggle.setAttribute("aria-pressed", String(!notes.hidden));
  });
  overviewToggle.addEventListener("click", () => setOverview(!overviewOn()));
  // 타일 클릭은 오버뷰에서만 슬라이드를 고른다 — 발표 중의 클릭은 넘기기가 아니다
  // (링크·코드 선택을 삼키지 않는다).
  slides.forEach((slide, index) => {
    slide.addEventListener("click", () => {
      if (!overviewOn()) return;
      show(index, true);
      setOverview(false);
    });
  });
  window.addEventListener("hashchange", () => show(fromHash(), false));
  window.addEventListener("resize", () => {
    fit();
    if (overviewOn()) overviewFit();
  });
  window.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
    case "ArrowRight": case "ArrowDown": case "PageDown": case " ":
      e.preventDefault(); show(current + 1, true); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); show(current - 1, true); break;
    case "Home": e.preventDefault(); show(0, true); break;
    case "End": e.preventDefault(); show(slides.length - 1, true); break;
    case "n": case "N": notesToggle.click(); break;
    case "o": case "O": e.preventDefault(); setOverview(!overviewOn()); break;
    case "Escape": if (overviewOn()) { e.preventDefault(); setOverview(false); } break;
    }
  });

  root.setAttribute("data-balpyo-view", "presenter");
  fit();
  // 해시가 있으면 그 슬라이드로 열되 해시는 손대지 않는다 — 사용자가 준 딥링크 형태
  // (번호든 id든)를 열자마자 바꿔치지 않는다. 해시가 없으면 첫 슬라이드고 URL은 깨끗하다.
  show(fromHash(), false);
})();
</script>
</body>
</html>
