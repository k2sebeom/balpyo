<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slots deck</title>
<meta name="author" content="balpyo">
<style>
@layer balpyo.base, balpyo.theme, balpyo.author;

@layer balpyo.base {
  :root {
    --balpyo-stage-width: 1280px;
    --balpyo-stage-height: 720px;
  }

  * { box-sizing: border-box; }

  /* 뷰어 크롬의 바탕 — 슬라이드 밖의 색이므로 덱의 색이 아니다 (테마 토큰이 아닌 유일한 색). */
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
  }

  .balpyo-deck {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 24px;
  }

  /* 슬라이드는 논리 스테이지 크기를 그대로 갖는다. 저자·웹·지오메트리 패스가 같은
     좌표계를 쓰므로 지오메트리 패스가 읽은 rect가 곧 PPTX 좌표다 (환산 분기 없음). */
  .balpyo-slide {
    position: relative;
    width: var(--balpyo-stage-width);
    height: var(--balpyo-stage-height);
    overflow: hidden;
  }

  /* 스테이지는 자식을 문서 순서대로 세로로 쌓는다. 여백 64px은 1280폭의 5%로,
     프로젝터의 오버스캔에서도 글자가 잘리지 않는다.

     text-autospace는 잰 폭을 고정한다 — 브라우저가 한글↔라틴 경계에 간격을 넣기
     시작하면(CSS Text 4는 그것을 기본값에 둔다) 잰 폭이 움직이고, 잰 폭이 곧 PPTX
     좌표이므로 저자가 아무것도 고치지 않은 채 줄이 다시 접힌다 (D11, ADR 0005). */
  .balpyo-stage {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    text-autospace: no-autospace;
  }

  /* 텍스트 블록은 콘텐츠 폭 전체를 갖는다 — 줄바꿈 폭이 확정되어야 브라우저가 잰 박스가
     PPTX 텍스트 박스로 그대로 간다. flex: 0 0 auto는 스택이 스테이지보다 길 때 박스가
     눌리는 것을 막는다 (기본 정책은 박스 고정 + 오버플로 허용 — PRD §13-1). */
  .balpyo-text {
    margin: 0;
    width: 100%;
    flex: 0 0 auto;
  }

  /* ── 발표자 뷰 ── 런타임 JS가 <html>에 data-balpyo-view="presenter"를 켠다.
     속성이 없으면(JS 꺼짐, 또는 지오메트리 패스가 지운 상태) 위의 세로 스택 그대로다. */
  .balpyo-viewer-bar, .balpyo-viewer-notes { display: none; }

  html[data-balpyo-view="presenter"] { height: 100%; }
  html[data-balpyo-view="presenter"] body { height: 100%; overflow: hidden; }
  html[data-balpyo-view="presenter"] .balpyo-deck {
    position: fixed;
    inset: 0;
    padding: 0;
    display: block;
  }

  /* 슬라이드는 전부 화면 가운데 겹쳐 두고 활성 슬라이드만 보인다. display가 아니라
     visibility인 이유와 transform 스케일인 이유는 파일 머리 주석에 있다. */
  html[data-balpyo-view="presenter"] .balpyo-slide {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--balpyo-view-scale, 1));
    visibility: hidden;
  }
  html[data-balpyo-view="presenter"] .balpyo-slide.balpyo-viewer-active {
    visibility: visible;
  }

  html[data-balpyo-view="presenter"] .balpyo-viewer-bar {
    display: flex;
    align-items: center;
    gap: 2px;
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 10;
    padding: 4px;
    border-radius: 999px;
    background: rgba(20, 20, 22, 0.88);
    color: #ddd;
    font: 14px/1 system-ui, sans-serif;
  }
  .balpyo-viewer-bar button {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .balpyo-viewer-bar button:hover { background: rgba(255, 255, 255, 0.12); }
  .balpyo-viewer-bar button:disabled { opacity: 0.35; cursor: default; background: transparent; }
  .balpyo-viewer-bar button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.18); }
  .balpyo-viewer-counter {
    padding: 0 10px;
    color: #aaa;
    font-variant-numeric: tabular-nums;
  }

  html[data-balpyo-view="presenter"] .balpyo-viewer-notes {
    display: block;
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    z-index: 10;
    width: min(640px, calc(100vw - 48px));
    max-height: 40vh;
    overflow-y: auto;
    padding: 14px 18px;
    border-radius: 12px;
    background: rgba(20, 20, 22, 0.92);
    color: #e6e6e6;
    font: 15px/1.6 system-ui, sans-serif;
    white-space: pre-wrap;
  }
  /* hidden 속성이 이겨야 한다 — 위의 display: block이 UA 스타일을 덮으므로 명시한다. */
  html[data-balpyo-view="presenter"] .balpyo-viewer-notes[hidden] { display: none; }
  .balpyo-viewer-notes.balpyo-viewer-empty { color: #999; font-style: italic; }
}

@layer balpyo.theme {
  /* 테마 "minimal"의 토큰 표 — 웹 변수와 PPTX 테마 파트가 이 한 표에서 나온다. */
  :root {
    --balpyo-color-fg: #1A1A1A;
    --balpyo-color-bg: #FFFFFF;
    --balpyo-color-muted: #6B7280;
    --balpyo-color-surface: #F3F4F6;
    --balpyo-color-accent1: #0F65F9;
    --balpyo-color-accent2: #0E8174;
    --balpyo-color-accent3: #15803D;
    --balpyo-color-accent4: #B45309;
    --balpyo-color-accent5: #DC2626;
    --balpyo-color-accent6: #9333EA;
    --balpyo-font-heading: "Noto Sans", "Noto Sans CJK KR", sans-serif;
    --balpyo-font-body: "Noto Sans", "Noto Sans CJK KR", sans-serif;
    --balpyo-font-mono: "Noto Sans Mono", "Noto Sans Mono CJK KR", monospace;
  }

  .balpyo-slide { background: var(--balpyo-color-bg); }

  .balpyo-stage.balpyo-slots > :is(.balpyo-text, .balpyo-list) { width: auto; }
  .balpyo-stage.balpyo-layout-content.balpyo-slots { display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr; grid-template-areas: "title" "body"; align-content: start; }
  .balpyo-stage.balpyo-layout-quote.balpyo-slots { display: grid; grid-template-columns: 1fr; grid-template-rows: auto auto; grid-template-areas: "quote" "attribution"; align-content: center; }
  .balpyo-stage.balpyo-layout-title.balpyo-slots { display: grid; grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr auto auto; grid-template-areas: "kicker" "title" "subtitle" "." "author" "date"; justify-items: center; align-content: center; }
  .balpyo-stage.balpyo-layout-two-column.balpyo-slots { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; grid-template-areas: "title title" "left right"; align-content: start; }
}
</style>
</head>
<body>
<div class="balpyo-deck" data-aspect="16:9" data-slides="5">
<section class="balpyo-slide" id="content-slots" data-slide-index="0" data-slide-source="slides/001_content_slots.slide">
<div class="balpyo-stage balpyo-layout-content balpyo-slots">
<h1 class="balpyo-text" data-balpyo-id="s0.0" data-balpyo-el="h1" style="font-family: var(--balpyo-font-heading); font-size: 56px; font-weight: 700; line-height: 1.2; color: var(--balpyo-color-fg); text-align: start; grid-area: title">분기 하이라이트</h1>
<p class="balpyo-text" data-balpyo-id="s0.1" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: body">매출이 전분기 대비 18% 늘었다. 남미 신규 시장이 성장을 이끌었다.</p>
</div>
</section>
<section class="balpyo-slide" id="two-column-slots" data-slide-index="1" data-slide-source="slides/002_two_column_slots.slide">
<div class="balpyo-stage balpyo-layout-two-column balpyo-slots">
<h1 class="balpyo-text" data-balpyo-id="s1.0" data-balpyo-el="h1" style="font-family: var(--balpyo-font-heading); font-size: 56px; font-weight: 700; line-height: 1.2; color: var(--balpyo-color-fg); text-align: start; grid-area: title">계획 대 실제</h1>
<p class="balpyo-text" data-balpyo-id="s1.1" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: left">계획: 세 개 팀을 하나로 통합한다.</p>
<p class="balpyo-text" data-balpyo-id="s1.2" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: right">실제: 두 개 팀을 통합하고 하나는 다음 분기로 이월했다.</p>
</div>
</section>
<section class="balpyo-slide" id="content-flow" data-slide-index="2" data-slide-source="slides/003_content_flow.slide">
<div class="balpyo-stage">
<div class="balpyo-text" data-balpyo-id="s2.0" data-balpyo-el="text" style="font-family: var(--balpyo-font-heading); font-size: 56px; font-weight: 700; line-height: 1.2; color: var(--balpyo-color-fg); text-align: start">흐름 모드</div>
<div class="balpyo-text" data-balpyo-id="s2.1" data-balpyo-el="text" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start">슬롯을 쓰지 않은 슬라이드는 blank 레이아웃을 그대로 가리킨다.</div>
</div>
</section>
<section class="balpyo-slide" id="title-slots" data-slide-index="3" data-slide-source="slides/004_title_slots.slide">
<div class="balpyo-stage balpyo-layout-title balpyo-slots">
<p class="balpyo-text" data-balpyo-id="s3.0" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: kicker">2026 H1</p>
<h1 class="balpyo-text" data-balpyo-id="s3.1" data-balpyo-el="h1" style="font-family: var(--balpyo-font-heading); font-size: 56px; font-weight: 700; line-height: 1.2; color: var(--balpyo-color-fg); text-align: start; grid-area: title">플랫폼 재설계</h1>
<p class="balpyo-text" data-balpyo-id="s3.2" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: subtitle">모놀리스에서 서비스 경계로</p>
<p class="balpyo-text" data-balpyo-id="s3.3" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: author">김서봄</p>
<p class="balpyo-text" data-balpyo-id="s3.4" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: start; grid-area: date">2026-09-20</p>
</div>
</section>
<section class="balpyo-slide" id="quote-slots" data-slide-index="4" data-slide-source="slides/005_quote_slots.slide">
<div class="balpyo-stage balpyo-layout-quote balpyo-slots">
<blockquote class="balpyo-text" data-balpyo-id="s4.0" data-balpyo-el="blockquote" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-muted); text-align: start; grid-area: quote">측정할 수 없는 것은 관리할 수 없다는 말은 절반만 맞다 — 측정한 것만 관리하면 측정하지 않은 것이 무너진다.</blockquote>
<p class="balpyo-text" data-balpyo-id="s4.1" data-balpyo-el="p" style="font-family: var(--balpyo-font-body); font-size: 24px; font-weight: 400; line-height: 1.5; color: var(--balpyo-color-fg); text-align: end; grid-area: attribution">— 운영 회고, 2026 H1</p>
</div>
</section>
</div>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  const slides = Array.from(document.querySelectorAll(".balpyo-slide"));
  if (slides.length === 0) return;

  const button = (cls, label, text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.setAttribute("aria-label", label);
    b.textContent = text;
    return b;
  };
  const prev = button("balpyo-viewer-prev", "Previous slide", "‹");
  const next = button("balpyo-viewer-next", "Next slide", "›");
  const notesToggle = button("balpyo-viewer-notes-toggle", "Toggle speaker notes", "Notes");
  notesToggle.setAttribute("aria-pressed", "false");
  const counter = document.createElement("span");
  counter.className = "balpyo-viewer-counter";

  const bar = document.createElement("nav");
  bar.className = "balpyo-viewer-bar";
  bar.setAttribute("aria-label", "Presentation controls");
  bar.append(prev, counter, next, notesToggle);

  const notes = document.createElement("aside");
  notes.className = "balpyo-viewer-notes";
  notes.setAttribute("aria-label", "Speaker notes");
  notes.hidden = true;

  document.body.append(notes, bar);

  let current = -1;

  // 배율은 창에 꽉 차는 fit이다. 레이아웃 크기(offsetWidth)는 transform과 무관하게 논리
  // 스테이지이므로, 잰 값을 다시 스케일하는 되먹임이 없다.
  const fit = () => {
    const scale = Math.min(
      window.innerWidth / slides[0].offsetWidth,
      window.innerHeight / slides[0].offsetHeight);
    root.style.setProperty("--balpyo-view-scale", String(scale));
  };

  const show = (index, writeHash) => {
    const target = Math.min(Math.max(index, 0), slides.length - 1);
    if (target === current) return;
    if (current >= 0) slides[current].classList.remove("balpyo-viewer-active");
    current = target;
    const slide = slides[current];
    slide.classList.add("balpyo-viewer-active");
    counter.textContent = (current + 1) + " / " + slides.length;
    prev.disabled = current === 0;
    next.disabled = current === slides.length - 1;
    const note = slide.querySelector(".balpyo-notes");
    notes.textContent = note ? note.textContent : "No notes for this slide.";
    notes.classList.toggle("balpyo-viewer-empty", !note);
    if (writeHash) {
      // 히스토리를 쌓지 않는다 — 뒤로 가기가 슬라이드를 되감으면 발표 중에 페이지를
      // 떠나는 길이 없어진다. file://에서 막는 브라우저가 있어도 조용히 넘어간다.
      try { history.replaceState(null, "", "#/" + encodeURIComponent(slide.id)); } catch (e) {}
    }
  };

  const fromHash = () => {
    let raw = location.hash.replace(/^#\/?/, "");
    try { raw = decodeURIComponent(raw); } catch (e) {}
    if (raw === "") return 0;
    const byID = slides.findIndex((s) => s.id === raw);
    if (byID >= 0) return byID;
    const n = Number(raw);
    if (Number.isInteger(n) && n >= 1 && n <= slides.length) return n - 1;
    return 0;
  };

  prev.addEventListener("click", () => show(current - 1, true));
  next.addEventListener("click", () => show(current + 1, true));
  notesToggle.addEventListener("click", () => {
    notes.hidden = !notes.hidden;
    notesToggle.setAttribute("aria-pressed", String(!notes.hidden));
  });
  window.addEventListener("hashchange", () => show(fromHash(), false));
  window.addEventListener("resize", fit);
  window.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
    case "ArrowRight": case "ArrowDown": case "PageDown": case " ":
      e.preventDefault(); show(current + 1, true); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); show(current - 1, true); break;
    case "Home": e.preventDefault(); show(0, true); break;
    case "End": e.preventDefault(); show(slides.length - 1, true); break;
    case "n": case "N": notesToggle.click(); break;
    }
  });

  root.setAttribute("data-balpyo-view", "presenter");
  fit();
  // 해시가 있으면 그 슬라이드로 열되 해시는 손대지 않는다 — 사용자가 준 딥링크 형태
  // (번호든 id든)를 열자마자 바꿔치지 않는다. 해시가 없으면 첫 슬라이드고 URL은 깨끗하다.
  show(fromHash(), false);
})();
</script>
</body>
</html>
